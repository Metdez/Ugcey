# UGC-relevant Higgsfield workflows, verified against docs.higgsfield.ai/llms-full.txt (2026-11).
# endpoint_id is the POST path. `defaults` are merged under caller args (drafts: 9:16, 5 s, 720p).
# `requires` lists args the caller must supply (image_asset_id fills image_url / reference_asset_ids fills image_urls).
# `cost_hint` is orientation only: the real number is always the live POST /estimate.
models:
  - endpoint_id: higgsfield-ai/soul/v2/standard
    kind: image
    label: Soul V2 creator still
    use: Photoreal creator or scene still that becomes the first frame of a clip (about 16 s to generate). Invents garbled labels, so never rely on it for readable product text; use Marketing Studio with real product photos when they exist.
    defaults: {aspect_ratio: "9:16", resolution: 1080p, batch_size: 1}
    cost_hint: "about $0.01 per 1080p still"
  - endpoint_id: marketing-studio/image
    kind: image
    label: Marketing Studio product still
    use: Product-in-hand or product ad still from real product photos (image_urls, product photo first, creator still second). Default whenever the operator supplied product photos.
    defaults: {aspect_ratio: "9:16", resolution: 1k, quality: medium}
    cost_hint: "about $0.03 at 1k medium, $0.21 at 2k high"
  - endpoint_id: marketing-studio/image/flare
    kind: image
    label: Marketing Studio 2.5 Flare product still
    use: 'Default first-frame and end-frame still whenever the operator supplied product photos (reference_asset_ids: product photos first, then the creator still for the end frame). In our test it reproduced the printed wordmark exactly from a 350 px photo, was the fastest of the three Marketing Studio versions (about 25 s) and looked most like a phone photo.'
    defaults: {aspect_ratio: "9:16", resolution: 2k, quality: high, enhance_prompt: false}
    cost_hint: "about $0.05 per 2k high still"
  - endpoint_id: higgsfield/ads-studio/v1.0
    kind: image
    label: Ads Studio from product images
    use: Several ad concepts from a brief plus product images (image_urls up to 10).
    defaults: {aspect_ratio: "9:16", batch_size: 1}
    cost_hint: "token-metered, estimate unavailable; roughly $0.08 per image"
  - endpoint_id: bytedance/seedance-2.5/text-to-video
    kind: video
    label: Seedance 2.5 text to video (audio)
    use: UGC clip with generated audio straight from a prompt, 4-30 s. No still needed.
    defaults: {aspect_ratio: "9:16", duration: 5, resolution: 720p, generate_audio: true}
    cost_hint: "about $0.46 per second at 720p ($2.30 for 5 s); 480p is $0.21/s"
  - endpoint_id: bytedance/seedance-2.5/image-to-video
    kind: video
    label: Seedance 2.5 image to video (audio)
    use: 'Default for every ad (480p previews, 720p finals): most consistent in our tests, including keeping a product shade right from application to the last frame. Animate a completed still (image_asset_id), 4-30 s, keeps the still''s aspect ratio. A 15 s ad with "Shot 1 (0-5s) ... Shot 2 (5-10s): Cut to ..." in the prompt cuts on time and keeps identity. Best label, hand and face stability in our tests; generation time varied from 2.5 to 10 min.'
    requires: [image_url]
    defaults: {duration: 5, resolution: 720p, generate_audio: true}
    cost_hint: "about $0.46 per second at 720p ($2.30 for 5 s); 480p is $0.21/s"
  - endpoint_id: bytedance/seedance-2.5/reference-to-video
    kind: video
    label: Seedance 2.5 multi-reference UGC video
    use: Keep one creator or product consistent across shots using up to 30 reference images (reference_asset_ids).
    requires: [image_urls]
    defaults: {aspect_ratio: "9:16", duration: 5, resolution: 720p, generate_audio: true}
    cost_hint: "about $0.46 per second at 720p; reference video inputs are billed too"
  - endpoint_id: kling-video/v3.0/std/image-to-video
    kind: video
    label: Kling 3.0 image to video (multi-shot)
    use: 'Only when speed matters more than consistency. In a product test it ignored the shot cuts and briefly added a skin blemish. Animate a still (image_asset_id) into 3-15 s; a whole 15 s ad in one call via multi_shots true + multi_prompt (up to 6 shots, each with prompt and duration), which cut on time and kept identity in our tests (about 3.5 min, $1.60). Tends to overshoot motion and let label text drift.'
    requires: [image_url]
    defaults: {duration: 5, sound: "on"}
    cost_hint: "about $0.54 for 5 s"
  - endpoint_id: alibaba/wan-3.0/image-to-video
    kind: video
    label: Wan 3.0 image to video (cheap draft)
    use: Cheapest motion sanity check only (480p). Followed actions less well than Seedance or Kling and does not predict how they will animate, so do not use it as a draft for them.
    requires: [image_url]
    defaults: {aspect_ratio: "9:16", duration: 5, resolution: 480p, generate_audio: true}
    cost_hint: "about $0.05 per second at 480p ($0.25 for 5 s)"
