[project]
name = "ugecy-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "deepagents==0.7.34",
  "langchain==1.4.9",
  "langgraph==1.2.20",
  "langchain-openai==1.7.4",
  "fastapi",
  "uvicorn[standard]",
  "sse-starlette",
  "httpx",
  "pydantic>=2",
  "pydantic-settings",
  "pillow",
  "pyyaml",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ugecy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
