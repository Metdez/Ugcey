[project]
name = "ugecy"
version = "0.1.0"
description = "Ugecy Deep Agents backend"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.34,<0.8",
    "firecrawl-py>=4.55,<5",
    "langchain-core>=1.7,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ugecy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
